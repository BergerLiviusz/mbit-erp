# Build gate: compile + package only (no functional HR/E2E tests). Add separate smoke/API tests later if needed.
name: Build Desktop App

on:
  push:
    branches:
      - main
      - master
      - package-1
      - package-2
      - package-3
      - package-4
      - package-5
      - package-hr
      - release/ginop-crm-dms-hr
      - release/full
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to build'
        required: false
        type: choice
        options:
          - full
          - package-1
          - package-2
          - package-3
          - package-4
          - package-5
          - package-hr
          - ginop-crm-dms-hr
        default: 'full'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [windows-latest]
        include:
          - os: windows-latest
            platform: win

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.18.2'
          cache: 'npm'

      - name: Install dependencies
        shell: pwsh
        run: |
          $maxRetries = 3
          $retryCount = 0
          $success = $false
          
          while ($retryCount -lt $maxRetries -and -not $success) {
            try {
              Write-Host "Attempting to install dependencies (attempt $($retryCount + 1)/$maxRetries)..."
              npm ci
              $success = $true
              Write-Host "✅ Dependencies installed successfully"
            } catch {
              $retryCount++
              if ($retryCount -lt $maxRetries) {
                $waitTime = $retryCount * 10
                Write-Host "⚠️ Installation failed, retrying in $waitTime seconds..."
                Start-Sleep -Seconds $waitTime
              } else {
                Write-Host "❌ Failed to install dependencies after $maxRetries attempts"
                throw
              }
            }
          }

      - name: Build shared config package
        shell: pwsh
        run: |
          Write-Host "=== Building @mbit-erp/config ==="
          npm run build --workspace=@mbit-erp/config

      - name: Determine package from branch
        id: package
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.event.inputs.package }}") {
            $package = "${{ github.event.inputs.package }}"
            Write-Host "Using package from workflow_dispatch input: $package"
          } elseif ("${{ github.ref }}" -eq "refs/heads/package-1") {
            $package = "package-1"
            Write-Host "Detected package-1 branch"
          } elseif ("${{ github.ref }}" -eq "refs/heads/package-2") {
            $package = "package-2"
            Write-Host "Detected package-2 branch"
          } elseif ("${{ github.ref }}" -eq "refs/heads/package-3") {
            $package = "package-3"
            Write-Host "Detected package-3 branch"
          } elseif ("${{ github.ref }}" -eq "refs/heads/package-4") {
            $package = "package-4"
            Write-Host "Detected package-4 branch"
          } elseif ("${{ github.ref }}" -eq "refs/heads/package-5") {
            $package = "package-5"
            Write-Host "Detected package-5 branch"
          } elseif ("${{ github.ref }}" -eq "refs/heads/package-hr") {
            $package = "hr"
            Write-Host "Detected package-hr branch (mapped to hr)"
          } elseif ("${{ github.ref }}" -eq "refs/heads/release/ginop-crm-dms-hr") {
            $package = "ginop-crm-dms-hr"
            Write-Host "Detected release/ginop-crm-dms-hr branch"
          } elseif ("${{ github.ref }}" -eq "refs/heads/release/full") {
            $package = "full"
            Write-Host "Detected release/full branch"
          } elseif ("${{ github.ref }}" -eq "refs/heads/main" -or "${{ github.ref }}" -eq "refs/heads/master") {
            $package = "full"
            Write-Host "Detected main/master branch, using full package"
          } else {
            $package = "full"
            Write-Host "Defaulting to full package"
          }
          
          Write-Host "Active package: $package"
          echo "package=$package" >> $env:GITHUB_OUTPUT

      - name: Generate Prisma Client and validate schema
        shell: pwsh
        env:
          DATABASE_URL: "file:./prisma/dev.db"
        run: |
          Write-Host "=== Generating Prisma Client ==="
          cd apps/server
          npx prisma generate
          
          Write-Host ""
          Write-Host "=== Validating Prisma schema ==="
          $env:DATABASE_URL = "file:./prisma/dev.db"
          npx prisma validate
          
          Write-Host ""
          Write-Host "=== Checking for migration files ==="
          $migrationsDir = "prisma/migrations"
          if (Test-Path $migrationsDir) {
            $migrations = Get-ChildItem $migrationsDir -Directory | Where-Object { $_.Name -match '^\d{14}_' }
            Write-Host "Found $($migrations.Count) migration(s)"
            
            foreach ($migration in $migrations) {
              $migrationFile = Join-Path $migration.FullName "migration.sql"
              if (Test-Path $migrationFile) {
                Write-Host "✅ $($migration.Name)"
              } else {
                Write-Host "⚠️ WARNING: Migration SQL file not found: $($migration.Name)"
              }
            }
          } else {
            Write-Host "⚠️ WARNING: Migrations directory not found"
            Write-Host "Note: Prisma will use db push for schema synchronization in Electron environment"
          }

      - name: Run server unit tests (CRM)
        shell: pwsh
        run: |
          Write-Host "=== Running CRM unit tests ==="
          cd apps/server
          npm test 2>&1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build server
        shell: pwsh
        env:
          ERP_PACKAGE: ${{ steps.package.outputs.package }}
          APP_VERSION: "1.0.1a"
        run: |
          Write-Host "=== Building server (package: $env:ERP_PACKAGE) ==="
          cd apps/server
          npm run build
          
          Write-Host ""
          Write-Host "=== Verifying build output ==="
          if (-not (Test-Path "dist")) {
            Write-Host "❌ ERROR: Build output directory not found!"
            exit 1
          }
          
          $distFiles = Get-ChildItem dist -Recurse -File | Measure-Object
          Write-Host "✅ Build completed: $($distFiles.Count) files in dist/"

      - name: Install server dependencies in HOISTED mode for packaging
        shell: pwsh
        run: |
          Write-Host "=== Installing server dependencies (production only, HOISTED mode, real files) ==="
          cd apps/server
          Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
          npm install --omit=dev --install-strategy=hoisted --install-links=false --workspaces=false
          
          Write-Host ""
          Write-Host "=== Verifying @mbit-erp/config in server node_modules ==="
          if (-not (Test-Path "node_modules/@mbit-erp/config/package.json")) {
            Write-Host "❌ ERROR: @mbit-erp/config not installed in server node_modules"
            exit 1
          }
          Write-Host "✅ @mbit-erp/config present"
          
          Write-Host ""
          Write-Host "=== Generating Prisma Client for production ==="
          npx prisma generate
          
          if (-not (Test-Path "node_modules/.prisma/client/default.js")) {
            Write-Host "❌ ERROR: node_modules/.prisma/client/default.js missing after prisma generate!"
            exit 1
          }
          Write-Host "✅ .prisma/client/default.js exists in server node_modules"
          
          $engines = Get-ChildItem "node_modules/.prisma/client" -Filter "*query_engine*" -ErrorAction SilentlyContinue
          if ($engines.Count -eq 0) {
            Write-Host "❌ ERROR: No Prisma query engine binary in .prisma/client"
            exit 1
          }
          foreach ($e in $engines) { Write-Host "✅ Prisma engine: $($e.Name)" }
          
          Write-Host ""
          Write-Host "=== Staging backend bundle for Electron (includes .prisma) ==="
          cd ../..
          node scripts/prepare-backend-bundle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cd apps/server
          
          Write-Host ""
          Write-Host "=== Verifying critical dependencies exist with REAL FILES ==="
          
          if (-not (Test-Path "node_modules/dotenv")) {
            Write-Host "❌ ERROR: dotenv directory not found!"
            exit 1
          }
          
          if (-not (Test-Path "node_modules/dotenv/package.json")) {
            Write-Host "❌ ERROR: dotenv/package.json not found (empty directory)!"
            exit 1
          }
          
          $dotenvAttrs = (Get-Item "node_modules/dotenv").Attributes
          if ($dotenvAttrs -match 'ReparsePoint') {
            Write-Host "❌ ERROR: dotenv is a Windows junction/reparse point!"
            Write-Host "Attributes: $dotenvAttrs"
            exit 1
          }
          
          Write-Host "✅ dotenv is REAL directory with files"
          
          Write-Host ""
          Write-Host "=== Verifying es-object-atoms has actual files (not empty directories) ==="
          $esInstances = Get-ChildItem -Path node_modules -Recurse -Filter "es-object-atoms" -Directory -ErrorAction SilentlyContinue
          
          if ($esInstances.Count -eq 0) {
            Write-Host "❌ ERROR: No es-object-atoms found anywhere in node_modules!"
            exit 1
          }
          
          Write-Host "Found $($esInstances.Count) instance(s) of es-object-atoms"
          
          $emptyDirFound = $false
          $junctionFound = $false
          foreach ($instance in $esInstances) {
            $attrs = $instance.Attributes
            $relPath = $instance.FullName.Replace((Get-Location).Path, ".")
            $pkgJson = Join-Path $instance.FullName "package.json"
            
            if ($attrs -match 'ReparsePoint') {
              Write-Host "❌ JUNCTION: $relPath"
              $junctionFound = $true
            } elseif (-not (Test-Path $pkgJson)) {
              Write-Host "❌ EMPTY DIR (no package.json): $relPath"
              $emptyDirFound = $true
            } else {
              Write-Host "✅ REAL DIR WITH FILES: $relPath"
            }
          }
          
          if ($junctionFound) {
            Write-Host ""
            Write-Host "❌ CRITICAL ERROR: Some es-object-atoms instances are junctions!"
            exit 1
          }
          
          if ($emptyDirFound) {
            Write-Host ""
            Write-Host "❌ CRITICAL ERROR: Some es-object-atoms directories are EMPTY (no files)!"
            exit 1
          }
          
          Write-Host ""
          Write-Host "✅ All dependencies installed as REAL FILES (no junctions, no empty dirs)"
          Write-Host ""
          Write-Host "=== Node modules size ==="
          $size = (Get-ChildItem node_modules -Recurse -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("{0:N2} MB" -f $size)

      - name: Build frontend
        shell: pwsh
        env:
          VITE_ACTIVE_PACKAGE: ${{ steps.package.outputs.package }}
          ERP_PACKAGE: ${{ steps.package.outputs.package }}
          VITE_APP_VERSION: "1.0.1a"
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          Write-Host "=== Building frontend for package: ${{ steps.package.outputs.package }} ==="
          Write-Host "VITE_ACTIVE_PACKAGE environment variable: $env:VITE_ACTIVE_PACKAGE"
          
          # Verify the environment variable is set
          if (-not $env:VITE_ACTIVE_PACKAGE) {
            Write-Host "❌ ERROR: VITE_ACTIVE_PACKAGE is not set!"
            exit 1
          }
          
          cd apps/web
          $env:ELECTRON_BUILD = "true"
          
          # Verify the variable is available before build
          Write-Host "Environment variables before build:"
          Get-ChildItem Env: | Where-Object { $_.Name -like "VITE_*" } | Format-Table
          
          npm run build
          
          Write-Host ""
          Write-Host "=== Verifying frontend build output ==="
          if (-not (Test-Path "dist")) {
            Write-Host "❌ ERROR: Frontend build output directory not found!"
            exit 1
          }
          
          $distFiles = Get-ChildItem dist -Recurse -File | Measure-Object
          Write-Host "✅ Frontend build completed: $($distFiles.Count) files in dist/"

      - name: Build Electron main process
        shell: pwsh
        run: |
          Write-Host "=== Building Electron main process ==="
          cd apps/desktop
          npx rimraf tsconfig.tsbuildinfo
          npx tsc
          
          Write-Host ""
          Write-Host "=== Verifying Electron build output ==="
          if (-not (Test-Path "dist-electron")) {
            Write-Host "❌ ERROR: Electron build output directory not found!"
            exit 1
          }
          
          $electronFiles = Get-ChildItem dist-electron -Recurse -File | Measure-Object
          Write-Host "✅ Electron build completed: $($electronFiles.Count) files in dist-electron/"

      - name: Verify icon files exist
        shell: pwsh
        run: |
          Write-Host "=== Verifying icon files ==="
          Write-Host "Current directory: $(Get-Location)"
          Write-Host "Listing apps/desktop/resources directory:"
          Get-ChildItem "apps/desktop/resources/" -ErrorAction SilentlyContinue | Select-Object Name, Length
          
          $iconIco = "apps/desktop/resources/icon.ico"
          $iconPng = "apps/desktop/resources/icon.png"
          
          Write-Host ""
          Write-Host "Checking for icon.ico..."
          if (-not (Test-Path $iconIco)) {
            Write-Host "❌ ERROR: icon.ico not found at $iconIco"
            Write-Host "Full path attempted: $((Get-Location).Path)\$iconIco"
            Write-Host "This will cause the Windows build to fail or use default icon"
            exit 1
          } else {
            $size = (Get-Item $iconIco).Length / 1KB
            Write-Host "✅ icon.ico found: $size KB"
            
            # Verify it's a valid ICO file (should start with specific bytes)
            $bytes = [System.IO.File]::ReadAllBytes($iconIco)
            if ($bytes.Length -lt 4) {
              Write-Host "❌ ERROR: icon.ico file is too small or invalid"
              exit 1
            }
            Write-Host "✅ icon.ico file appears valid (size: $($bytes.Length) bytes)"
          }
          
          Write-Host ""
          Write-Host "Checking for icon.png..."
          if (-not (Test-Path $iconPng)) {
            Write-Host "⚠️ WARNING: icon.png not found at $iconPng"
          } else {
            $size = (Get-Item $iconPng).Length / 1KB
            Write-Host "✅ icon.png found: $size KB"
          }

      - name: Write desktop build meta
        shell: pwsh
        env:
          ERP_PACKAGE: ${{ steps.package.outputs.package }}
          VITE_ACTIVE_PACKAGE: ${{ steps.package.outputs.package }}
          APP_VERSION: "1.0.1a"
          BUILD_SHA: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          node apps/desktop/scripts/write-build-meta.mjs

      - name: Package desktop app
        shell: pwsh
        env:
          VITE_ACTIVE_PACKAGE: ${{ steps.package.outputs.package }}
          ERP_PACKAGE: ${{ steps.package.outputs.package }}
          APP_VERSION: "1.0.1a"
          BUILD_SHA: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          Write-Host "=== Packaging desktop app ==="
          cd apps/desktop
          
          # Clean release directory to avoid file locking issues on Windows
          Write-Host "Cleaning release directory..."
          if (Test-Path "release") {
            # Try multiple times with increasing delays
            $maxRetries = 5
            $retryCount = 0
            $removed = $false
            
            while ($retryCount -lt $maxRetries -and -not $removed) {
              try {
                Remove-Item -Recurse -Force "release" -ErrorAction Stop
                $removed = $true
                Write-Host "✅ Release directory removed successfully"
              } catch {
                $retryCount++
                if ($retryCount -lt $maxRetries) {
                  $delay = $retryCount * 2
                  Write-Host "⚠️ Retry ${retryCount}/${maxRetries}: Waiting $delay seconds before retry..."
                  Start-Sleep -Seconds $delay
                  
                  # Try to unlock files by forcing garbage collection
                  [System.GC]::Collect()
                  [System.GC]::WaitForPendingFinalizers()
                } else {
                  Write-Host "❌ Failed to remove release directory after $maxRetries attempts"
                  throw
                }
              }
            }
            
            # Final wait to ensure file system has released all locks
            Start-Sleep -Seconds 3
          }
          
          # Ensure icon file is not locked
          $iconPath = "resources/icon.ico"
          if (Test-Path $iconPath) {
            Write-Host "Verifying icon.ico is accessible..."
            try {
              $file = [System.IO.File]::Open($iconPath, 'Open', 'Read', 'Read')
              $file.Close()
              Write-Host "✅ icon.ico is accessible"
            } catch {
              Write-Host "⚠️ Warning: Could not verify icon.ico accessibility: $_"
            }
          }
          
          Write-Host "Starting packaging..."
          npm run package:${{ matrix.platform }}
          
          Write-Host ""
          Write-Host "=== Verifying package output ==="
          if (-not (Test-Path "release")) {
            Write-Host "❌ ERROR: Release folder not found!"
            exit 1
          }
          
          $releaseFiles = Get-ChildItem release -Recurse -File | Measure-Object
          Write-Host "✅ Package completed: $($releaseFiles.Count) files in release/"

      - name: Fix Prisma client in win-unpacked (post-package)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "=== fix-windows-unpacked-prisma (staging → resources/backend/node_modules/.prisma) ==="
          node scripts/fix-windows-unpacked-prisma.mjs apps/desktop/release/win-unpacked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify packaged build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "=== Verifying Windows build output ==="
          
          $releaseDir = "apps/desktop/release"
          if (-not (Test-Path $releaseDir)) {
            Write-Host "❌ ERROR: Release folder not found!"
            exit 1
          }
          
          Write-Host ""
          Write-Host "=== Checking .exe files ==="
          $exeFiles = Get-ChildItem $releaseDir -Filter "*.exe" -Recurse
          foreach ($exe in $exeFiles) {
            $sizeMB = $exe.Length / 1MB
            Write-Host ("{0} - {1:N2} MB" -f $exe.Name, $sizeMB)
          }
          
          Write-Host ""
          Write-Host "=== CRITICAL: Verifying backend dependencies in packaged build ==="
          $unpackedBackend = "apps/desktop/release/win-unpacked/resources/backend"
          
          if (-not (Test-Path "$unpackedBackend/node_modules")) {
            Write-Host "❌ CRITICAL ERROR: backend/node_modules not found in packaged build!"
            exit 1
          }
          
          if (-not (Test-Path "$unpackedBackend/node_modules/dotenv")) {
            Write-Host "❌ CRITICAL ERROR: dotenv not found in packaged build!"
            Get-ChildItem "$unpackedBackend/node_modules/" | Select-Object -First 20
            exit 1
          }
          
          Write-Host ""
          Write-Host "=== FILE-LEVEL verification: Checking es-object-atoms has actual files in packaged build ==="
          $packedEsInstances = Get-ChildItem -Path "$unpackedBackend/node_modules" -Recurse -Filter "es-object-atoms" -Directory -ErrorAction SilentlyContinue
          
          if ($packedEsInstances.Count -eq 0) {
            Write-Host "❌ CRITICAL ERROR: No es-object-atoms found in packaged build!"
            exit 1
          }
          
          Write-Host "Found $($packedEsInstances.Count) instance(s) of es-object-atoms in packaged build"
          
          $packedJunctionFound = $false
          $packedEmptyDirFound = $false
          foreach ($instance in $packedEsInstances) {
            $attrs = $instance.Attributes
            $relPath = $instance.FullName.Replace((Get-Location).Path, ".")
            $pkgJson = Join-Path $instance.FullName "package.json"
            
            if ($attrs -match 'ReparsePoint') {
              Write-Host "❌ JUNCTION IN PACKAGE: $relPath"
              $packedJunctionFound = $true
            } elseif (-not (Test-Path $pkgJson)) {
              Write-Host "❌ EMPTY DIR IN PACKAGE (no package.json): $relPath"
              Write-Host "   Path length: $($relPath.Length) chars"
              $packedEmptyDirFound = $true
            } else {
              Write-Host "✅ REAL DIR WITH FILES IN PACKAGE: $relPath"
            }
          }
          
          if ($packedJunctionFound) {
            Write-Host ""
            Write-Host "❌ CRITICAL ERROR: Packaged build contains junctions!"
            exit 1
          }
          
          if ($packedEmptyDirFound) {
            Write-Host ""
            Write-Host "❌ CRITICAL ERROR: Packaged build has EMPTY es-object-atoms directories!"
            Write-Host "This means NSIS installer skipped files due to Windows path length limit (~260 chars)."
            exit 1
          }
          
          Write-Host ""
          Write-Host "=== Verifying Prisma schema and client in packaged build ==="
          $prismaSchema = "$unpackedBackend/prisma/schema.prisma"
          $prismaClient = "$unpackedBackend/node_modules/.prisma/client"
          
          if (-not (Test-Path $prismaSchema)) {
            Write-Host "❌ CRITICAL ERROR: Prisma schema not found in packaged build!"
            exit 1
          }
          Write-Host "✅ Prisma schema found"
          
          if (-not (Test-Path $prismaClient)) {
            Write-Host "❌ CRITICAL ERROR: Prisma client directory not found in packaged build!"
            exit 1
          }
          Write-Host "✅ Prisma client directory found"
          
          $prismaDefaultJs = "$unpackedBackend/node_modules/.prisma/client/default.js"
          $prismaIndexJs = "$unpackedBackend/node_modules/.prisma/client/index.js"
          if (-not (Test-Path $prismaDefaultJs) -and -not (Test-Path $prismaIndexJs)) {
            Write-Host "❌ CRITICAL ERROR: .prisma/client/default.js and index.js both missing!"
            exit 1
          }
          Write-Host "✅ .prisma/client entry script present"
          
          if (-not (Test-Path "$unpackedBackend/node_modules/@prisma/client/default.js")) {
            Write-Host "❌ CRITICAL ERROR: @prisma/client/default.js missing in packaged build!"
            exit 1
          }
          Write-Host "✅ @prisma/client/default.js present"
          
          $winEngines = Get-ChildItem "$prismaClient" -Filter "*windows*" -ErrorAction SilentlyContinue
          if ($winEngines.Count -eq 0) {
            $anyEngine = Get-ChildItem "$prismaClient" -Filter "query_engine*" -ErrorAction SilentlyContinue
            if ($anyEngine.Count -eq 0) {
              Write-Host "❌ CRITICAL ERROR: No Prisma query engine in packaged .prisma/client!"
              exit 1
            }
            Write-Host "⚠️ WARNING: query_engine-windows not found by name; found: $($anyEngine.Name)"
          } else {
            foreach ($e in $winEngines) { Write-Host "✅ Packaged Prisma engine: $($e.Name)" }
          }
          
          Write-Host ""
          Write-Host "✅ Backend dependencies successfully bundled (all real files with content)"
          
          $nodeModulesSize = (Get-ChildItem "$unpackedBackend/node_modules" -Recurse -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("Backend node_modules size: {0:N2} MB" -f $nodeModulesSize)
          
          Write-Host ""
          Write-Host "Sample packages in bundle:"
          Get-ChildItem "$unpackedBackend/node_modules/" | Select-Object -First 10
          
          Write-Host ""
          Write-Host "=== Verifying frontend in packaged build ==="
          $unpackedFrontend = "apps/desktop/release/win-unpacked/resources/frontend"
          if (-not (Test-Path $unpackedFrontend)) {
            Write-Host "❌ CRITICAL ERROR: Frontend not found in packaged build!"
            exit 1
          }
          Write-Host "✅ Frontend found"
          
          $frontendFiles = Get-ChildItem $unpackedFrontend -Recurse -File | Measure-Object
          Write-Host ("Frontend files: {0}" -f $frontendFiles.Count)
          
          Write-Host ""
          Write-Host "=== Verifying icon file in packaged build ==="
          $iconInResources = "apps/desktop/release/win-unpacked/resources/icon.ico"
          if (Test-Path $iconInResources) {
            $iconSize = (Get-Item $iconInResources).Length / 1KB
            Write-Host "✅ icon.ico found in resources: $iconSize KB"
          } else {
            Write-Host "⚠️ WARNING: icon.ico not found in resources folder"
            Write-Host "   Expected location: $iconInResources"
            Write-Host "   Listing resources folder contents:"
            Get-ChildItem "apps/desktop/release/win-unpacked/resources/" | Select-Object Name, Length
          }
          
          Write-Host ""
          Write-Host "=== Checking if .exe has embedded icon ==="
          $exeFile = Get-ChildItem "apps/desktop/release/win-unpacked" -Filter "*.exe" | Select-Object -First 1
          if ($exeFile) {
            Write-Host "EXE file: $($exeFile.Name)"
            Write-Host "Note: Icon embedding is handled by electron-builder during build process"
            Write-Host "If icon.ico is specified in package.json, it should be embedded in the .exe"
          }

      - name: Verify Windows artifact (Prisma + launcher)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "=== Node verify-windows-artifact ==="
          node scripts/verify-windows-artifact.mjs apps/desktop/release/win-unpacked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify portable app folder (win-unpacked)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "=== Verifying portable app folder (win-unpacked) ==="
          
          $unpackedDir = "apps/desktop/release/win-unpacked"
          if (-not (Test-Path $unpackedDir)) {
            Write-Host "❌ ERROR: win-unpacked directory not found at $unpackedDir"
            exit 1
          }
          
          $exeFiles = Get-ChildItem $unpackedDir -Filter "*.exe" -File
          if ($exeFiles.Count -eq 0) {
            Write-Host "❌ ERROR: No .exe launcher found in win-unpacked!"
            Get-ChildItem $unpackedDir | Format-Table Name, Length
            exit 1
          }
          
          foreach ($exe in $exeFiles) {
            $sizeMB = $exe.Length / 1MB
            Write-Host ("✅ Launcher: {0} ({1:N2} MB)" -f $exe.Name, $sizeMB)
          }
          
          $requiredPaths = @(
            "resources/backend",
            "resources/frontend",
            "resources/backend/node_modules"
          )
          foreach ($rel in $requiredPaths) {
            $full = Join-Path $unpackedDir $rel
            if (-not (Test-Path $full)) {
              Write-Host "❌ ERROR: Missing required path: $rel"
              exit 1
            }
            Write-Host "✅ Found: $rel"
          }
          
          Write-Host ""
          Write-Host "Portable app is ready for artifact upload (direct run, no installer)."

      - name: Create portable ZIP from win-unpacked
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "=== Creating portable ZIP from win-unpacked ==="
          
          $packageJson = Get-Content "apps/desktop/package.json" -Raw | ConvertFrom-Json
          $version = $packageJson.version
          $pkg = "${{ steps.package.outputs.package }}"
          
          $unpackedDir = "apps/desktop/release/win-unpacked"
          $zipPath = "apps/desktop/release/mbit-erp-v$version-$pkg-portable-windows.zip"
          
          if (-not (Test-Path $unpackedDir)) {
            Write-Host "❌ ERROR: win-unpacked directory not found!"
            exit 1
          }
          
          Write-Host "Packaging version: $version package: $pkg"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "$unpackedDir/*" -DestinationPath $zipPath -Force
          
          $zipSizeMB = (Get-Item $zipPath).Length / 1MB
          Write-Host ("✅ Created portable ZIP: {0} ({1:N2} MB)" -f (Split-Path $zipPath -Leaf), $zipSizeMB)

      - name: List release outputs before artifact upload
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "=== Release folder contents ==="
          Get-ChildItem "apps/desktop/release" -Recurse -Depth 2 | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Debug .prisma in win-unpacked and final verify (pre-upload)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $unpacked = "apps/desktop/release/win-unpacked"
          $prismaClient = "$unpacked/resources/backend/node_modules/.prisma/client"
          $prismaDefault = "$prismaClient/default.js"

          if (-not (Test-Path $prismaDefault)) {
            Write-Host "❌ CRITICAL: resources/backend/node_modules/.prisma/client/default.js missing before upload!"
            Write-Host "   (resources/backend/prisma/schema.prisma alone is NOT sufficient)"
            exit 1
          }

          Write-Host "=== .prisma files in final portable artifact (pre-upload) ==="
          Get-ChildItem -Recurse "$unpacked/resources/backend/node_modules/.prisma" -ErrorAction Stop |
            Select-Object FullName, Length |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "=== Final verify-windows-artifact on win-unpacked ==="
          node scripts/verify-windows-artifact.mjs $unpacked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify NSIS installer contents
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "=== Verifying NSIS installer embeds resources ==="
          
          $setupExe = Get-ChildItem "apps/desktop/release" -Filter "*Setup*.exe" | Select-Object -First 1
          
          if (-not $setupExe) {
            Write-Host "⚠️ WARNING: NSIS Setup.exe not found, skipping verification"
            exit 0
          }
          
          Write-Host "Found installer: $($setupExe.Name)"
          $installerSizeMB = $setupExe.Length / 1MB
          Write-Host ("Installer size: {0:N2} MB" -f $installerSizeMB)
          
          Write-Host ""
          Write-Host "NOTE: NSIS installers are self-extracting archives."
          Write-Host "Expected size: ~200-300 MB with full backend + node_modules"
          Write-Host ""
          
          if ($installerSizeMB -lt 180) {
            Write-Host ""
            Write-Host "=========================================="
            Write-Host "⚠️  CRITICAL WARNING: NSIS INSTALLER IS BROKEN"
            Write-Host "=========================================="
            Write-Host ""
            Write-Host "Installer size: $($installerSizeMB.ToString('F2')) MB (expected: 200-300 MB)"
            Write-Host ""
            Write-Host "This indicates resources are NOT embedded in the NSIS package."
            Write-Host "Known issue: electron-builder NSIS target fails to include extraResources."
            Write-Host ""
            Write-Host "DO NOT USE THE SETUP.EXE INSTALLER!"
            Write-Host ""
            Write-Host "✅ WORKING SOLUTION: Download 'Mbit-ERP-Portable-*.zip' instead"
            Write-Host "   - Extract the ZIP file"
            Write-Host "   - Run 'Mbit ERP.exe' directly"
            Write-Host "   - All resources are included in the portable version"
            Write-Host ""
            Write-Host "=========================================="
            Write-Host ""
            Write-Host "Build will continue to upload artifacts..."
          } elseif ($installerSizeMB -lt 200) {
            Write-Host "⚠️ WARNING: Installer size is smaller than expected (< 200 MB)."
            Write-Host "Expected: 200-300 MB with full backend + node_modules"
            Write-Host "Installer may be missing some resources."
            Write-Host "Recommend using Portable ZIP distribution instead."
          } else {
            Write-Host "✅ Installer size looks correct (>= 200 MB, likely includes bundled resources)"
          }

      - name: Resolve version for artifact name
        id: appver
        shell: pwsh
        run: |
          $pkg = Get-Content apps/desktop/package.json | ConvertFrom-Json
          $ver = $pkg.version
          $sha = "${{ github.sha }}".Substring(0, 7)
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "short_sha=$sha" >> $env:GITHUB_OUTPUT

      # --- Artifact 1: teljes futtatható alkalmazásmappa (win-unpacked) – KÖTELEZŐ teszteléshez ---
      - name: Upload portable app folder (win-unpacked)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: mbit-erp-v${{ steps.appver.outputs.version }}-${{ steps.appver.outputs.short_sha }}-${{ steps.package.outputs.package }}-portable-app
          path: apps/desktop/release/win-unpacked/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

      # --- Artifact 2: portable ZIP (kicsomagolható, ugyanaz a tartalom) ---
      - name: Upload portable ZIP
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: mbit-erp-v${{ steps.appver.outputs.version }}-${{ steps.appver.outputs.short_sha }}-${{ steps.package.outputs.package }}-portable-zip
          path: apps/desktop/release/mbit-erp-v${{ steps.appver.outputs.version }}-${{ steps.package.outputs.package }}-portable-windows.zip
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

      # --- Artifact 3: NSIS telepítő (opcionális; ismert issue: kisebb méretnél ne használd) ---
      - name: Upload installer (setup exe)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: mbit-erp-v${{ steps.appver.outputs.version }}-${{ steps.appver.outputs.short_sha }}-${{ steps.package.outputs.package }}-installer
          path: apps/desktop/release/*-setup.exe
          retention-days: 30
          if-no-files-found: warn

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            apps/desktop/release/mbit-erp-v*-portable-windows.zip
            apps/desktop/release/*-setup.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
